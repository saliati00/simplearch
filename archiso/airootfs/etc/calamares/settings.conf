---
modules-search: [ local ]

instances:
- id: gpu
  module: packagechooser
  config: packagechooser-gpu.conf
- id: gpu
  module: shellprocess
  config: shellprocess-gpu.conf
- id: postinstall
  module: shellprocess
  config: shellprocess-postinstall.conf
- id: preflight
  module: shellprocess
  config: shellprocess-preflight.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@gpu
  - summary
- exec:
  - shellprocess@preflight
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - services-systemd
  - shellprocess@postinstall
  - shellprocess@gpu
  - initcpiocfg
  - initcpio
  - bootloader
  - umount
- show:
  - finished

branding: simplearch

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
