---
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "sddm.service"
      action: "enable"
      mandatory: true
    - name: "bluetooth.service"
      action: "enable"
      mandatory: false
    - name: "ufw.service"
      action: "enable"
      mandatory: false
    - name: "fstrim.timer"
      action: "enable"
      mandatory: false
    - name: "qemu-guest-agent.service"
      action: "enable"
      mandatory: false
    - name: "spice-vdagentd.service"
      action: "enable"
      mandatory: false
    - name: "snapper-timeline.timer"
      action: "enable"
      mandatory: false
    - name: "snapper-cleanup.timer"
      action: "enable"
      mandatory: false
    - name: "grub-btrfsd.service"
      action: "enable"
      mandatory: false
    - name: "systemd-zram-setup@zram0.service"
      action: "enable"
      mandatory: false
