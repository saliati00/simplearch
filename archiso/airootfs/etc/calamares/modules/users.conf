---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - audio
    - video
    - network
    - storage
    - lp
    - name: wheel
      must_exist: false
      system: true
    - name: autologin
      must_exist: false
      system: true

sudoersGroup: wheel
autologinGroup: autologin
sudoersConfigureWithGroup: false

setRootPassword: false
doReusePassword: false

displayAutologin: true
doAutologin: false

passwordRequirements:
    minLength: 1
    maxLength: -1

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/zsh
    forbidden_names: [ root, nobody, simplearch, live ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "arch"
    forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    fullName:
        editable: true
    loginName:
        editable: true
